<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
{% if page.description %}  <meta name="description" content="{{ page.description }}">
{% endif %}{% if page.robots %}  <meta name="robots" content="{{ page.robots }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap">

</head>
<body>

{% include header.html %}

{% endunless %}
<script data-goatcounter="https://sognevo.goatcounter.com/count"

{% if page.repo %}
<script src="/js/release.js" data-repo="{{ page.repo }}" data-name="{{ page.plugin }}"></script>
{% endif %}
</body>
</html>
